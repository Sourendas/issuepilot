<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IssuePilot — Nebius × NVIDIA</title>
  <style>
    :root { --bg:#0b1020; --panel:#141b2d; --text:#e8eefc; --muted:#9aa8c7; --accent:#7c5cff; --ok:#5ddea0; --border:#2a3550; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background: radial-gradient(900px 500px at 0% 0%, #1a1540, transparent), var(--bg); color: var(--text); }
    .wrap { max-width: 960px; margin: 0 auto; padding: 20px; display: grid; gap: 14px; }
    header { padding: 14px 16px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; }
    h1 { margin: 0; font-size: 1.2rem; } h1 span { color: var(--accent); }
    .badges { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
    .badge { font-size: 0.72rem; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
    .badge.on { color: var(--ok); border-color: rgba(93,222,160,0.35); }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 12px; display:flex; flex-direction:column; gap:8px; min-height: 360px; }
    textarea { width:100%; min-height: 220px; flex:1; border-radius:10px; border:1px solid var(--border); background:#0e1424; color:var(--text); padding:10px; font: inherit; }
    button { border:1px solid rgba(124,92,255,0.45); background: linear-gradient(180deg,#2a2255,#1c1738); color:var(--text); border-radius:10px; padding:10px 14px; font-weight:600; cursor:pointer; }
    pre { margin:0; padding:10px; background:#0a1020; border:1px solid var(--border); border-radius:10px; overflow:auto; font-size:0.78rem; flex:1; white-space: pre-wrap; }
    footer { color: var(--muted); font-size: 0.78rem; }
    .summary { font-size: 0.9rem; line-height: 1.45; }
    .summary h3 { margin: 0 0 6px; font-size: 0.85rem; color: var(--muted); font-weight: 600; }
    ul { margin: 0 0 8px; padding-left: 1.1rem; }
    .rowbtns { display:flex; gap:8px; }
    button.ghost { background: transparent; border-color: var(--border); font-weight: 500; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1><span>IssuePilot</span> · issue → fix plan</h1>
      <div class="badges">
        <span class="badge on" id="modeBadge">mode: …</span>
        <span class="badge">Nebius Token Factory</span>
        <span class="badge">NVIDIA Nemotron (when keyed)</span>
        <span class="badge">offline mock OK</span>
      </div>
    </header>
    <div class="grid">
      <section class="panel">
        <strong>Paste GitHub issue</strong>
        <textarea id="issue" placeholder="Title: …&#10;Body: …"></textarea>
        <div class="rowbtns">
          <button id="go" type="button">Plan issue</button>
          <button id="sample" class="ghost" type="button">Load sample</button>
        </div>
      </section>
      <section class="panel">
        <strong>Plan</strong>
        <div id="human" class="summary">Load the sample issue, then plan it. Mock mode needs no key.</div>
        <pre id="out">{}</pre>
      </section>
    </div>
    <footer id="footer">Mock planner — checking key…</footer>
  </div>
  <script>
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function renderPlan(j) {
      document.getElementById('out').textContent = JSON.stringify(j, null, 2);
      const list = (arr) => (arr && arr.length)
        ? '<ul>' + arr.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>'
        : '<p>—</p>';
      const mode = (j.meta && j.meta.mode) || '?';
      document.getElementById('human').innerHTML =
        '<h3>Severity ' + esc(j.severity) + ' · ' + esc(mode) + '</h3>' +
        '<p>' + esc(j.summary) + '</p>' +
        '<h3>Repro gaps</h3>' + list(j.repro_gaps) +
        '<h3>Fix plan</h3>' + list(j.fix_plan) +
        '<h3>Tests</h3>' + list(j.test_ideas) +
        '<h3>PR</h3><p>' + esc(j.pr_title) + '</p>';
    }
    function applyFooter(j) {
      document.getElementById('modeBadge').textContent = 'mode: ' + (j.mode || '?');
      const footer = document.getElementById('footer');
      if (j.footer) {
        footer.textContent = j.footer;
        return;
      }
      if (j.mode === 'live') {
        footer.textContent = 'Nebius Token Factory + NVIDIA model ' + (j.model || '');
      } else {
        footer.textContent = 'Mock planner (no API key)';
      }
    }
    async function refreshHealth() {
      try {
        const r = await fetch('/health');
        applyFooter(await r.json());
      } catch (e) {
        document.getElementById('footer').textContent = 'Mock planner (health unreachable)';
      }
    }
    document.getElementById('sample').onclick = async () => {
      const r = await fetch('/sample-issue');
      document.getElementById('issue').value = await r.text();
    };
    document.getElementById('go').onclick = async () => {
      const issue = document.getElementById('issue').value;
      const r = await fetch('/api/plan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ issue })
      });
      const j = await r.json();
      renderPlan(j);
      if (j.meta) applyFooter({ mode: j.meta.mode, model: j.meta.model, footer: j.meta.footer });
    };
    refreshHealth();
  </script>
</body>
</html>
